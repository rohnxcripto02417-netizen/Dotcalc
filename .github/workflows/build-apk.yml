name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: mkdir -p www && cp -r app/. www/
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android
      - name: Configure app (version, orientation, permissions, no backup)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:configChanges/android:screenOrientation="portrait" android:configChanges/' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' $M
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $M
          sed -i 's/versionCode 1/versionCode 2/; s/versionName "1.0"/versionName "2.0.0"/' android/app/build.gradle
      - run: npx cap sync android
      - name: Build release (not debug)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign with a release key
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          keytool -genkeypair -keystore dotcalc.keystore -alias dotcalc -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dotcalc-pass -keypass dotcalc-pass -dname "CN=Rohan, O=Dotcalc, C=IN"
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $ANDROID_HOME/build-tools/$BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks dotcalc.keystore --ks-key-alias dotcalc \
            --ks-pass pass:dotcalc-pass --key-pass pass:dotcalc-pass --out Dotcalc-2.0.0.apk aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify --verbose Dotcalc-2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dotcalc-apk
          path: Dotcalc-2.0.0.apk
